name: RDP-Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Configure RDP (NLA on, Tailscale-only firewall)
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 2 -Force

          # Disable the built-in RDP rules, then allow 3389 only from Tailscale addresses
          Disable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -DisplayName "RDP-Tailscale" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP-Tailscale" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -RemoteAddress 100.64.0.0/10

          Restart-Service -Name TermService -Force

      - name: Create RDP user
        shell: pwsh
        env:
          RDP_USER: ${{ secrets.RDP_USER }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_USER) -or [string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              Write-Error "RDP_USER or RDP_PASSWORD secret is missing."
              exit 1
          }

          if (Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name $env:RDP_USER
          }

          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name $env:RDP_USER -Password $securePass -AccountNeverExpires -PasswordNeverExpires -ErrorAction Stop | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER -ErrorAction Stop
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USER -ErrorAction Stop
          Write-Host "User created and added to groups."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Connect to Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey="$env:TS_AUTHKEY" --hostname="gh-win-$env:GITHUB_RUN_ID" --unattended
          if ($LASTEXITCODE -ne 0) {
              Write-Error "tailscale up failed (check TAILSCALE_AUTH_KEY)."
              exit 1
          }

          $tsIP = $null
          for ($i = 0; $i -lt 12 -and -not $tsIP; $i++) {
              $tsIP = (& $ts ip -4 2>$null | Select-Object -First 1)
              if (-not $tsIP) { Start-Sleep -Seconds 5 }
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned."
              exit 1
          }
          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP port
        shell: pwsh
        run: |
          $r = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $r.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not reachable."
              exit 1
          }
          Write-Host "RDP port is reachable."

      - name: Keep alive
        shell: pwsh
        run: |
          Write-Host "=== RDP READY ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username/Password: from your repo secrets"
          Write-Host "================="
          while ($true) {
              Write-Host "[$(Get-Date)] RDP active"
              Start-Sleep -Seconds 300
          }
