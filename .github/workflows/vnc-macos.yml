name: RustDesk-macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustdesk:
    runs-on: macos-15   # Apple Silicon (ARM)
    timeout-minutes: 360

    steps:
      - name: Create admin user (for macOS auth dialogs)
        env:
          MAC_USER: ${{ secrets.MAC_USER }}
          MAC_PASSWORD: ${{ secrets.MAC_PASSWORD }}
        run: |
          if [ -z "$MAC_USER" ] || [ -z "$MAC_PASSWORD" ]; then
            echo "MAC_USER or MAC_PASSWORD secret is missing."
            exit 1
          fi
          sudo dscl . -create "/Users/$MAC_USER"
          sudo dscl . -create "/Users/$MAC_USER" UserShell /bin/zsh
          sudo dscl . -create "/Users/$MAC_USER" RealName "$MAC_USER"
          sudo dscl . -create "/Users/$MAC_USER" UniqueID 1001
          sudo dscl . -create "/Users/$MAC_USER" PrimaryGroupID 80
          sudo dscl . -create "/Users/$MAC_USER" NFSHomeDirectory "/Users/$MAC_USER"
          sudo dscl . -passwd "/Users/$MAC_USER" "$MAC_PASSWORD"
          sudo dscl . -append /Groups/admin GroupMembership "$MAC_USER"
          sudo createhomedir -c -u "$MAC_USER" || sudo mkdir -p "/Users/$MAC_USER"
          echo "User created."

      - name: Install and connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          brew install tailscale
          sudo brew services start tailscale
          sleep 5

          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="gh-mac-$GITHUB_RUN_ID"

          TS_IP=""
          for i in $(seq 1 12); do
            TS_IP=$(tailscale ip -4 2>/dev/null | head -n 1)
            [ -n "$TS_IP" ] && break
            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned."
            exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Install RustDesk
        run: |
          brew install --cask rustdesk
          ls -la /Applications/RustDesk.app/Contents/MacOS/ || true

      - name: Grant TCC permissions to RustDesk
        run: |
          DB="/Library/Application Support/com.apple.TCC/TCC.db"

          grant() {
            # $1=service  $2=client  $3=client_type (0=bundle id, 1=path)
            sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified) VALUES ('$1','$2',$3,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER));" \
              || echo "WARNING: failed to grant $1 to $2"
          }

          for svc in kTCCServiceScreenCapture kTCCServiceAccessibility kTCCServicePostEvent kTCCServiceListenEvent; do
            grant "$svc" "com.carriez.rustdesk" 0
            grant "$svc" "/Applications/RustDesk.app/Contents/MacOS/RustDesk" 1
          done

          sudo killall tccd 2>/dev/null || true
          sleep 2
          sudo sqlite3 "$DB" "select service,client,auth_value from access where client like '%rustdesk%' or client like '%RustDesk%';"

      - name: Configure RustDesk (direct IP, permanent password)
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo "RUSTDESK_PASSWORD secret is missing."
            exit 1
          fi

          CFG="$HOME/Library/Preferences/com.carriez.RustDesk"
          mkdir -p "$CFG"

          # Permanent password
          cat > "$CFG/RustDesk.toml" <<EOF
          password = '$RUSTDESK_PASSWORD'
          EOF

          # Direct IP access + password-only approval (nobody is there to click "Accept")
          cat > "$CFG/RustDesk2.toml" <<EOF
          [options]
          direct-server = 'Y'
          approve-mode = 'password'
          verification-method = 'use-permanent-password'
          EOF

          # Best effort: also set the password through the CLI
          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --password "$RUSTDESK_PASSWORD" || echo "CLI password set failed (non-fatal)."

      - name: Start RustDesk
        run: |
          open -a RustDesk
          sleep 15
          ps -axo pid,user,comm | grep -i rustdesk | grep -v grep || echo "WARNING: RustDesk is not running"
          echo "--- listening on 21118 ---"
          sudo lsof -iTCP:21118 -sTCP:LISTEN || echo "WARNING: nothing is listening on 21118"
          nc -z -w 5 "$TAILSCALE_IP" 21118 && echo "Direct port reachable on Tailscale IP." || echo "WARNING: 21118 not reachable on $TAILSCALE_IP"
          echo "--- RustDesk logs (tail) ---"
          for f in "$HOME"/Library/Logs/RustDesk/*.log; do [ -f "$f" ] && tail -n 15 "$f"; done 2>/dev/null || true

      - name: Keep alive
        run: |
          caffeinate -dimsu &
          echo "=== RUSTDESK READY ==="
          echo "Connect to: $TAILSCALE_IP"
          echo "Password: from your repo secrets (RUSTDESK_PASSWORD)"
          echo "======================"
          while true; do
            echo "[$(date)] RustDesk active"
            sleep 300
          done
