name: VNC-macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vnc:
    runs-on: macos-15   # Apple Silicon (ARM)
    timeout-minutes: 360

    steps:
      - name: Create VNC user
        env:
          MAC_USER: ${{ secrets.MAC_USER }}
          MAC_PASSWORD: ${{ secrets.MAC_PASSWORD }}
        run: |
          if [ -z "$MAC_USER" ] || [ -z "$MAC_PASSWORD" ]; then
            echo "MAC_USER or MAC_PASSWORD secret is missing."
            exit 1
          fi

          sudo dscl . -create "/Users/$MAC_USER"
          sudo dscl . -create "/Users/$MAC_USER" UserShell /bin/zsh
          sudo dscl . -create "/Users/$MAC_USER" RealName "$MAC_USER"
          sudo dscl . -create "/Users/$MAC_USER" UniqueID 1001
          sudo dscl . -create "/Users/$MAC_USER" PrimaryGroupID 80
          sudo dscl . -create "/Users/$MAC_USER" NFSHomeDirectory "/Users/$MAC_USER"
          sudo dscl . -passwd "/Users/$MAC_USER" "$MAC_PASSWORD"
          sudo dscl . -append /Groups/admin GroupMembership "$MAC_USER"
          sudo createhomedir -c -u "$MAC_USER" || sudo mkdir -p "/Users/$MAC_USER"
          echo "User created."

      - name: Install and connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          brew install tailscale
          sudo brew services start tailscale
          sleep 5

          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="gh-mac-$GITHUB_RUN_ID"

          TS_IP=""
          for i in $(seq 1 12); do
            TS_IP=$(tailscale ip -4 2>/dev/null | head -n 1)
            [ -n "$TS_IP" ] && break
            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned."
            exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Grant TCC permissions to Screen Sharing
        run: |
          DB="/Library/Application Support/com.apple.TCC/TCC.db"

          grant() {
            # $1=service  $2=client  $3=client_type (0=bundle id, 1=path)
            sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified) VALUES ('$1','$2',$3,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER));" \
              || echo "WARNING: failed to grant $1 to $2"
          }

          for svc in kTCCServiceScreenCapture kTCCServiceAccessibility kTCCServicePostEvent kTCCServiceListenEvent; do
            grant "$svc" "com.apple.screensharing.agent" 0
            grant "$svc" "com.apple.RemoteDesktopAgent" 0
            grant "$svc" "/System/Library/CoreServices/RemoteManagement/screensharingd" 1
            grant "$svc" "/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/MacOS/ARDAgent" 1
          done

          # make tccd reload the database
          sudo killall tccd 2>/dev/null || true
          sleep 2
          sudo sqlite3 "$DB" "select service,client,auth_value from access where client like '%screensharing%' or client like '%RemoteDesktop%' or client like '%ARDAgent%' or client like '%screensharingd%';"

      - name: Enable Screen Sharing (VNC)
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if [ -z "$VNC_PASSWORD" ]; then
            echo "VNC_PASSWORD secret is missing."
            exit 1
          fi
          # macOS only uses the first 8 characters of a VNC password
          VNC_PW8="${VNC_PASSWORD:0:8}"

          KICKSTART=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart

          sudo "$KICKSTART" \
            -activate -configure -access -on \
            -allowAccessFor -allUsers -privs -all \
            -clientopts -setmenuextra -menuextra yes

          sudo "$KICKSTART" \
            -configure -clientopts \
            -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "$VNC_PW8"

          sudo "$KICKSTART" -restart -agent -console

      - name: Check VNC port
        run: |
          sleep 5
          sudo lsof -iTCP:5900 -sTCP:LISTEN || echo "WARNING: nothing is listening on 5900"
          nc -z -w 5 "$TAILSCALE_IP" 5900 && echo "VNC port reachable on Tailscale IP." || echo "WARNING: port 5900 not reachable on $TAILSCALE_IP"

      - name: Diagnostics (black screen)
        run: |
          sw_vers || true
          echo "--- SIP ---"
          csrutil status || true
          echo "--- console user ---"
          stat -f%Su /dev/console || true
          who || true
          echo "--- displays ---"
          system_profiler SPDisplaysDataType 2>&1 | head -25 || true
          echo "--- screen sharing processes ---"
          ps -axo pid,user,comm | grep -iE 'screensharing|ARDAgent|RemoteManagement|screencapture' | grep -v grep || true
          echo "--- listening on 5900 ---"
          sudo lsof -iTCP:5900 -sTCP:LISTEN || true

      - name: Keep alive
        run: |
          caffeinate -dimsu &
          echo "=== VNC READY ==="
          echo "Address: $TAILSCALE_IP"
          echo "Username/Password: from your repo secrets"
          echo "================="
          while true; do
            echo "[$(date)] VNC active"
            sleep 300
          done
